<mat-grid-list [cols]="12" rowHeight="13rem">

  <mat-grid-tile [colspan]="4" [rowspan]="2">
    <mat-card>
      <mat-card-header><mat-card-title>Filter Harvest</mat-card-title></mat-card-header>
      <mat-card-content>
        <mat-form-field appearance="outline" style="margin-right: 16px;">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDate">
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" style="margin-right: 16px;">
          <mat-label>End Date</mat-label>
          <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDate">
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" style="margin-right: 16px;">
          <mat-label>Min Quantity</mat-label>
          <input matInput type="number" min="0" [(ngModel)]="minQty">
        </mat-form-field>

        <mat-form-field appearance="outline" style="margin-right: 16px;">
          <mat-label>Max Quantity</mat-label>
          <input matInput type="number" min="0" [(ngModel)]="maxQty">
        </mat-form-field>

        <button mat-raised-button class="brand-btn" (click)="applyFilter()" style="margin-right: 8px;">Search</button>
        <button mat-stroked-button class="brand-btn-outline" (click)="clearFilter()">Clear</button>
      </mat-card-content>
    </mat-card>
  </mat-grid-tile>

  <mat-grid-tile [colspan]="8" [rowspan]="2">
    <mat-card>
      <mat-card-header><mat-card-title>Harvest - Table View</mat-card-title></mat-card-header>
      <mat-card-content>

        <mat-table [dataSource]="data">
          <ng-container *ngFor="let column of columns; let i = index;" [matColumnDef]="column">
            <mat-header-cell *matHeaderCellDef>{{ headers[i] }}</mat-header-cell>
            <mat-cell *matCellDef="let element">{{ element[binders[i]] }}</mat-cell>
              <ng-container *matFooterCellDef>
                <mat-footer-cell *ngIf="i === 0">{{ ftext }}</mat-footer-cell>
                <mat-footer-cell *ngIf="i === 1"></mat-footer-cell>
                <mat-footer-cell *ngIf="i > 1 && i < 3">{{ total[i-2] }}</mat-footer-cell>
                <mat-footer-cell *ngIf="i === 3"></mat-footer-cell>
              </ng-container>
          </ng-container>

          <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: columns;"></mat-row>
          <mat-footer-row *matFooterRowDef="columns"></mat-footer-row>
        </mat-table>

      </mat-card-content>
    </mat-card>
  </mat-grid-tile>

  <mat-grid-tile [colspan]="8" [rowspan]="2">
    <mat-card>
      <mat-card-header><mat-card-title>Harvest - Column Chart</mat-card-title></mat-card-header>
      <mat-card-content><canvas #columnchart></canvas></mat-card-content>
    </mat-card>
  </mat-grid-tile>

  <mat-grid-tile [colspan]="4" [rowspan]="2">
    <mat-card>
      <mat-card-header><mat-card-title>Harvest - Pie Chart View</mat-card-title></mat-card-header>
      <mat-card-content><canvas #piechart></canvas></mat-card-content>
    </mat-card>
  </mat-grid-tile>

</mat-grid-list>
