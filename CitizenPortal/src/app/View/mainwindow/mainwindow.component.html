<mat-toolbar class="top-navbar">

  <!-- Logo Area -->
  <div class="logo-section">
    <mat-icon class="logo-icon">account_balance</mat-icon>
    <span class="system-title">Grama Niladhari Office Citizen Portal</span>
  </div>

  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- Navigation Buttons -->
  <div class="nav-buttons">

    <button mat-button routerLink="home" >
      <mat-icon>home</mat-icon>
      Home
    </button>

    <button mat-button routerLink="citizen">
      <mat-icon>groups</mat-icon>
      Citizen Login
    </button>

    <button mat-button routerLink="certificate">
      <mat-icon>description</mat-icon>
      Certificates
    </button>

    <button mat-button routerLink="treecuttingrequest">
      <mat-icon>description</mat-icon>
      Tree Cutting Request
    </button>

    <button mat-button routerLink="idcardrequest">
      <mat-icon>description</mat-icon>
      ID Card Request
    </button>

    <button mat-button routerLink="complaint">
      <mat-icon>report_problem</mat-icon>
      Complaint
    </button>


    <button mat-icon-button  (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>

</mat-toolbar>

<!-- Main Layout: Routed content + Announcement Board -->
<div class="page-wrapper">

  <!-- Routed Components Load Here -->
  <div class="main-content">
    <router-outlet></router-outlet>
  </div>

  <!-- Announcement Board Sidebar -->
  <app-announcement-board></app-announcement-board>

</div>
